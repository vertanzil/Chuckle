<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chuckle - Chuck Norris Jokes</title>
    <script>
      // Fetch a random Chuck Norris joke
      async function fetchJoke() {
        try {
          const response = await fetch("https://api.chucknorris.io/jokes/random");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.json();
          const { icon_url, id, value } = data;
          return { icon_url, id, value };
        } catch (error) {
          console.error("Error fetching joke:", error);
          throw error;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const speechBubble = document.querySelector(".speech-bubble");
        const refreshBtn = document.getElementById("refresh-btn");
        const autoCb = document.getElementById("auto-refresh-checkbox");

        let autoTimer = null;
        let inFlight = false;

        async function refreshJoke() {
          if (!speechBubble || inFlight) return;
          inFlight = true;

          const originalBtnText = refreshBtn ? refreshBtn.textContent : "";
          if (refreshBtn) {
            refreshBtn.disabled = true;
            refreshBtn.textContent = "Refreshing...";
          }

          const prevText = speechBubble.textContent;
          speechBubble.textContent = "Loading joke...";

          try {
            const joke = await fetchJoke();
            speechBubble.textContent = joke.value;
          } catch (e) {
            console.error("Failed to fetch a new joke:", e);
            speechBubble.textContent = "Failed to fetch a new joke. Try again.";
            // Optional: restore previous text after a brief delay
            // setTimeout(() => (speechBubble.textContent = prevText), 1500);
          } finally {
            inFlight = false;
            if (refreshBtn) {
              refreshBtn.disabled = false;
              refreshBtn.textContent = originalBtnText;
            }
          }
        }

        // Initial fetch
        refreshJoke();

        // Manual refresh
        if (refreshBtn) {
          refreshBtn.addEventListener("click", refreshJoke);
        }

        // Auto refresh toggle
        if (autoCb) {
          autoCb.addEventListener("change", () => {
            if (autoCb.checked) {
              // Immediately refresh, then every 5 seconds
              refreshJoke();
              autoTimer = setInterval(refreshJoke, 5000);
            } else {
              if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
              }
            }
          });
        }

        // Clean up timer if the page is hidden/unloaded
        window.addEventListener("beforeunload", () => {
          if (autoTimer) clearInterval(autoTimer);
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden && autoTimer) {
            clearInterval(autoTimer);
            autoTimer = null;
            if (autoCb) autoCb.checked = false;
          }
        });
      });
    </script>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f3f4f6;
      }

      .banner {
        max-width: 600px;
        width: 80%;
        margin-bottom: 20px;
        display: block;
      }

      .container {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .speech-bubble {
        position: relative;
        background: #df7943;
        color: white;
        border-radius: 10px;
        padding: 15px;
        max-width: 320px;
        word-wrap: break-word;
      }

      .speech-bubble::after {
        content: "";
        position: absolute;
        left: -10px;
        width: 0;
        height: 0;
        border: 10px solid transparent;
        border-right-color: #df7943;
        border-left: 0;
        margin-top: -10px;
      }

      .image {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }

      .refresh-btn {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }

      .refresh-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .checkbox-label {
        font-size: 14px;
        user-select: none;
        cursor: pointer;
        color: #111827;
      }

      @media screen and (max-width: 600px) {
        .container {
          flex-direction: column;
          text-align: center;
        }

        .speech-bubble::after {
          position: absolute;
          left: -10px;
          width: 0;
          height: 0;
          border: 10px solid transparent;
          border-right-color: #0078d7;
          border-left: 0;
          margin-top: -10px;
        }

        .controls {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <img src="banner.png" alt="Banner" class="banner" />

    <div class="container">
      <img src="chuck.png" alt="Person" class="image" />
      <div class="speech-bubble">Loading joke...</div>
    </div>

    <div class="controls">
      <button id="refresh-btn" class="refresh-btn">Chuckle me.</button>
      <label class="checkbox-label">
        <input type="checkbox" id="auto-refresh-checkbox" />
        Auto refresh every 5s
      </label>
    </div>
  </body>
</html>
